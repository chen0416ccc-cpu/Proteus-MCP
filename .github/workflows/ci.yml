name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install --no-deps .
      - run: python scripts/run_tests.py --profile portable
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python scripts/check_release.py --artifacts dist
      - name: Install wheel outside checkout
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python scripts/smoke_stdio.py
